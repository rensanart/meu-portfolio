<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato | Renan W. Santana (Ren-San)</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon-r.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- HEADER COM LOGO ANIMADO NO LUGAR DO NOME -->
  <header class="header">
    <div class="header-container">
      
      <a href="index.html" class="header-logo-link" aria-label="Renan W. Santana (Ren-San) Home">
        <img src="assets/LOGOR_animated_negative.svg" alt="Logo R Animado" class="header-logo-r">
      </a>

      <nav class="nav-menu">
        <a href="index.html" class="nav-link" data-i18n="nav.design">Design</a>
        <a href="ilustracoes.html" class="nav-link" data-i18n="nav.illustrations">Ilustrações</a>
        <a href="index.html#sobre" class="nav-link" data-i18n="nav.about">Sobre</a>
        <a href="contato.html" class="nav-link active" data-i18n="nav.contact">Contato</a>
      </nav>

      <div class="header-actions">
        <div class="social-links">
          <a href="https://cara.app/rensan" target="_blank" aria-label="Cara.app">Ca</a>
          <a href="https://www.behance.net/rennsant" target="_blank" aria-label="Behance">Be</a>
          <a href="https://www.instagram.com/rensanart/" target="_blank" aria-label="Instagram">Ig</a>
          <a href="https://www.linkedin.com/in/renan-santana-4514b31b9/" target="_blank" aria-label="LinkedIn">In</a>
        </div>
        <div class="lang-switch" role="group" aria-label="Seletor de idioma / Language selector">
          <button type="button" class="lang-btn active" data-lang="pt" aria-label="Português">PT</button>
          <span class="lang-divider">/</span>
          <button type="button" class="lang-btn" data-lang="en" aria-label="English">EN</button>
        </div>
      </div>
    </div>
  </header>

  <!-- PÁGINA DE CONTATO COM FORMULÁRIO MINIMALISTA CONECTADO AO GMAIL -->
  <main class="contact-page-container">

    <!-- BARRA INFORMATIVA SUPERIOR (ESTILO MATHI MÜLLER) -->
    <div class="contact-info-top">
      <div class="info-row">
        <span class="info-badge" data-i18n="contact.country">Brasil</span>
        <span class="info-badge">2026</span>
      </div>

      <div class="info-row">
        <a href="mailto:rennsant.design@gmail.com" class="info-badge" style="text-decoration: none;">rennsant.design@gmail.com</a>
        <a href="https://wa.me/5519981929803" target="_blank" class="info-badge" style="text-decoration: none;">+55 (19) 98192-9803</a>
      </div>
    </div>

    <!-- FORMULÁRIO DE CONTATO INTEGRADO COM CAMPO TELEFONE/WHATSAPP -->
    <form class="contact-form" id="portfolio-contact-form" action="https://api.web3forms.com/submit" method="POST">
      
      <!-- CONFIGURAÇÃO DO DESTINATÁRIO -->
      <input type="hidden" name="access_key" value="a505901f-d556-42bc-9560-50276ad61a4a">
      <input type="hidden" name="subject" value="Nova mensagem enviada pelo seu Portfólio - Renan W. Santana (Ren-San)">
      <input type="hidden" name="from_name" value="Portfólio Renan W. Santana (Ren-San)">
      <input type="hidden" name="to_email" value="rennsant.design@gmail.com">

      <!-- NOME E SOBRENOME (SIDE BY SIDE) -->
      <div class="form-grid-2">
        <div class="form-group">
          <span class="form-label-badge" data-i18n="contact.name_label">Nome</span>
          <input type="text" name="nome" class="form-input-line" placeholder="Seu nome" data-i18n-placeholder="contact.name_placeholder" required>
        </div>

        <div class="form-group">
          <span class="form-label-badge" data-i18n="contact.lastname_label">Sobrenome</span>
          <input type="text" name="sobrenome" class="form-input-line" placeholder="Seu sobrenome" data-i18n-placeholder="contact.lastname_placeholder">
        </div>
      </div>

      <!-- EMAIL E TELEFONE / WHATSAPP (SIDE BY SIDE) -->
      <div class="form-grid-2">
        <div class="form-group">
          <span class="form-label-badge" data-i18n="contact.email_label">E-mail *</span>
          <input type="email" name="email" class="form-input-line" placeholder="seuemail@exemplo.com" data-i18n-placeholder="contact.email_placeholder" required>
        </div>

        <div class="form-group">
          <span class="form-label-badge" data-i18n="contact.phone_label">Telefone / WhatsApp</span>
          <input type="tel" name="telefone" class="form-input-line" placeholder="(19) 99999-9999" data-i18n-placeholder="contact.phone_placeholder">
        </div>
      </div>

      <!-- MENSAGEM -->
      <div class="form-group">
        <span class="form-label-badge" data-i18n="contact.message_label">Mensagem</span>
        <textarea name="mensagem" class="form-input-line" rows="3" placeholder="Escreva sua mensagem aqui..." data-i18n-placeholder="contact.message_placeholder" required></textarea>
      </div>

      <!-- BOTÃO ENVIAR PRETO E RETO -->
      <button type="submit" class="btn-submit-pill" data-i18n="contact.submit_btn">Enviar</button>

    </form>

    <!-- INICIAIS DAS REDES SOCIAIS IGUAL À HOME (Be, Ig, In) -->
    <div class="contact-page-socials">
      <a href="https://www.behance.net/rennsant" target="_blank" class="info-badge" style="text-decoration: none; padding: 10px 22px;">Be</a>
      <a href="https://www.instagram.com/rensanart/" target="_blank" class="info-badge" style="text-decoration: none; padding: 10px 22px;">Ig</a>
      <a href="https://www.linkedin.com/in/renan-santana-4514b31b9/" target="_blank" class="info-badge" style="text-decoration: none; padding: 10px 22px;">In</a>
    </div>

  </main>

  <!-- RODAPÉ COM LOGO ESTÁTICO DO FRAME 5 NO LADO ESQUERDO -->
  <footer class="footer">
    <div class="footer-container">
      
      <div class="footer-logo-left">
        <a href="index.html" aria-label="REN Logo Frame 5">
          <img src="assets/logo-r.svg" alt="R Logo" class="footer-logo-r">
        </a>
      </div>

      <div class="footer-right-content">
        <p>© <span id="year"></span> Renan W. Santana (Ren-San). <span data-i18n="footer.rights">Todos os direitos reservados.</span></p>
        <a href="#" class="back-top" data-i18n="footer.back_to_top">VOLTAR AO TOPO ↑</a>
      </div>

    </div>
  </footer>

  <script src="js/translations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
