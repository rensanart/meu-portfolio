<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_2" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1323.6 1305.2">
  <defs>
    <style>
      

      /* Base onda */
      .wave-contour-neg {
        transform-origin: 670px 625px;
        fill: none;
        stroke: #000000;
        animation-duration: 6.4s;
        animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
        animation-iteration-count: infinite;
      }

      /* Ondas com delays concêntricos propagando do R para fora (2x mais lento) */
      .wave-neg-1 {
        stroke-width: 3.0px;
        animation-name: wavePulseNeg1;
        animation-delay: 0.0s;
      }

      .wave-neg-2 {
        stroke-width: 2.2px;
        animation-name: wavePulseNeg2;
        animation-delay: 0.7s;
      }

      .wave-neg-3 {
        stroke-width: 2.0px;
        animation-name: wavePulseNeg3;
        animation-delay: 1.4s;
      }

      .wave-neg-4 {
        stroke-width: 1.8px;
        animation-name: wavePulseNeg4;
        animation-delay: 2.1s;
      }

      .wave-neg-5 {
        stroke-width: 1.6px;
        animation-name: wavePulseNeg5;
        animation-delay: 2.8s;
      }

      .wave-neg-6 {
        stroke-width: 1.2px;
        animation-name: wavePulseNeg6;
        animation-delay: 3.5s;
      }

      .wave-neg-7 {
        stroke-width: 1.0px;
        animation-name: wavePulseNeg7;
        animation-delay: 4.2s;
      }

      @keyframes pulseCoreNeg {
        0%, 100% {
          transform: scale(1);
        }
        25% {
          transform: scale(1.035);
        }
        50% {
          transform: scale(0.99);
        }
      }

      @keyframes wavePulseNeg1 {
        0%, 100% {
          transform: scale(1);
          opacity: 0.85;
        }
        22% {
          transform: scale(1.025);
          opacity: 1;
        }
        55% {
          transform: scale(0.995);
          opacity: 0.7;
        }
      }

      @keyframes wavePulseNeg2 {
        0%, 100% {
          transform: scale(1);
          opacity: 0.75;
        }
        24% {
          transform: scale(1.028);
          opacity: 0.95;
        }
        58% {
          transform: scale(0.992);
          opacity: 0.6;
        }
      }

      @keyframes wavePulseNeg3 {
        0%, 100% {
          transform: scale(1);
          opacity: 0.65;
        }
        26% {
          transform: scale(1.03);
          opacity: 0.9;
        }
        60% {
          transform: scale(0.99);
          opacity: 0.5;
        }
      }

      @keyframes wavePulseNeg4 {
        0%, 100% {
          transform: scale(1);
          opacity: 0.55;
        }
        28% {
          transform: scale(1.032);
          opacity: 0.85;
        }
        62% {
          transform: scale(0.988);
          opacity: 0.4;
        }
      }

      @keyframes wavePulseNeg5 {
        0%, 100% {
          transform: scale(1);
          opacity: 0.45;
        }
        30% {
          transform: scale(1.035);
          opacity: 0.8;
        }
        65% {
          transform: scale(0.985);
          opacity: 0.35;
        }
      }

      @keyframes wavePulseNeg6 {
        0%, 100% {
          transform: scale(1);
          opacity: 0.35;
        }
        32% {
          transform: scale(1.038);
          opacity: 0.75;
        }
        68% {
          transform: scale(0.982);
          opacity: 0.25;
        }
      }

      @keyframes wavePulseNeg7 {
        0%, 100% {
          transform: scale(1);
          opacity: 0.3;
        }
        35% {
          transform: scale(1.04);
          opacity: 0.7;
        }
        70% {
          transform: scale(0.98);
          opacity: 0.2;
        }
      }
    </style>
  </defs>

